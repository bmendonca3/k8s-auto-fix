apiVersion: v1
kind: Pod
metadata:
  name: tiny-sys-admin
spec:
  containers:
    - name: shell
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - sleep 3600
      securityContext:
        allowPrivilegeEscalation: true
        capabilities:
          add:
            - SYS_ADMIN
