apiVersion: v1
kind: Pod
metadata:
  name: tiny-hostpath-hostport
spec:
  containers:
    - name: web
      image: nginx:1.25.4
      ports:
        - containerPort: 8080
          hostPort: 30080
      volumeMounts:
        - name: host-data
          mountPath: /data
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  volumes:
    - name: host-data
      hostPath:
        path: /var/lib/tiny-regression
        type: DirectoryOrCreate
