apiVersion: v1
kind: Pod
metadata:
  name: tiny-env-secret
spec:
  containers:
    - name: api
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - sleep 3600
      env:
        - name: API_PASSWORD
          value: plaintext-password
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
