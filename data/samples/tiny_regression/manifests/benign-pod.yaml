apiVersion: v1
kind: Pod
metadata:
  name: tiny-benign
spec:
  containers:
    - name: app
      image: nginx:1.25.4
      ports:
        - containerPort: 8080
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
